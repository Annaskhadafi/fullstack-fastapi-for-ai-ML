[project]
name = "fastapi-ai-monolith"
version = "1.0.0"
description = "Production-ready FastAPI Monolith boilerplate for Computer Vision (OpenCV + YOLO ONNX), RAG (Neon pgvector), and Machine Learning (Scikit-Learn/ONNX) with Jinja2/HTMX/Tailwind."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "pgvector>=0.3.5",
    "opencv-python-headless>=4.10.0.84",
    "numpy>=1.26.0,<3.0.0",
    "pillow>=10.4.0",
    "onnxruntime>=1.19.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.2",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
