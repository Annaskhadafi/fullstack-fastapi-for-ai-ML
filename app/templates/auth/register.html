{% extends "base.html" %}

{% block title %}Daftar Akun - FastAPI AI Monolith{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[75vh]">
    <div class="card w-full max-w-md bg-base-100 shadow-xl border border-base-200">
        <div class="card-body p-8">
            <div class="text-center mb-6">
                <div class="inline-flex p-3 rounded-2xl bg-secondary/10 text-secondary mb-3">
                    <i data-lucide="user-plus" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-bold tracking-tight">Buat Akun Baru</h2>
                <p class="text-sm text-gray-400 mt-1">Mulai gunakan fitur CV, RAG, dan ML boilerplate</p>
            </div>

            {% if error %}
            <div class="alert alert-error text-sm mb-4 py-2.5">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/register" method="POST" class="space-y-4">
                <div class="form-control">
                    <label class="label"><span class="label-text font-medium">Nama Lengkap</span></label>
                    <input type="text" name="full_name" value="{{ full_name if full_name else '' }}" placeholder="John Doe" class="input input-bordered w-full focus:input-primary" />
                </div>

                <div class="form-control">
                    <label class="label"><span class="label-text font-medium">Alamat Email</span></label>
                    <input type="email" name="email" value="{{ email if email else '' }}" required placeholder="nama@domain.com" class="input input-bordered w-full focus:input-primary" />
                </div>

                <div class="form-control">
                    <label class="label"><span class="label-text font-medium">Kata Sandi</span></label>
                    <input type="password" name="password" required minlength="6" placeholder="Minimal 6 karakter" class="input input-bordered w-full focus:input-primary" />
                </div>

                <button type="submit" class="btn btn-primary w-full shadow-lg shadow-primary/25 mt-2">
                    Daftar & Masuk
                </button>
            </form>

            <div class="divider text-xs text-gray-500 my-6">Sudah memiliki akun?</div>

            <div class="text-center">
                <a href="/login" class="btn btn-outline btn-block text-sm">
                    Masuk ke Akun
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
